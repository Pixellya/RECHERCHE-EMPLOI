# Récupère les nouvelles offres plusieurs fois par jour et publie le site sur GitHub Pages.
name: Mise à jour des offres

on:
  schedule:
    - cron: "17 5,9,13,17 * * *" # 4 fois par jour : 7h17, 11h17, 15h17, 19h17 (heure de Paris en été)
  push:
    branches: [main]
  workflow_dispatch: # bouton « Run workflow » pour lancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Indeed et LinkedIn via JobSpy. Étape isolée : si ces sites bloquent,
      # la mise à jour continue avec les autres sources.
      - name: Récupérer Indeed et LinkedIn (JobSpy)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          pip install --quiet python-jobspy==1.1.82
          python scripts/offres_jobspy.py

      - name: Récupérer les offres
        run: node scripts/fetch-offres.mjs
        env:
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}

      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html candidatures.html style.css app.js sites.js candidatures.js data vendor _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v4
